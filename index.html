    <!--
      The hero's entrance is gated on JavaScript: its elements start at
      opacity 0 and animate in. Without this guard, a visitor whose JS fails
      or is blocked would be served a hero with invisible text. Content must
      never depend on an animation firing.
    -->
    <noscript>
      <style>
        [data-hero] * {
          opacity: 1 !important;
          transform: none !important;
          clip-path: none !important;
        }
      </style>
    </noscript>
